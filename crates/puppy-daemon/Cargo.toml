[package]
name = "puppy-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
puppy-core = { path = "../puppy-core" }
puppy-proto = { path = "../puppy-proto" }
puppy-torrent = { path = "../puppy-torrent" }
serde.workspace = true
thiserror.workspace = true
url.workspace = true
dirs.workspace = true
toml.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-util.workspace = true
interprocess.workspace = true
anyhow.workspace = true
fs4.workspace = true
tracing-subscriber.workspace = true
humantime.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Owner-only security descriptor for the named pipe.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
widestring = "1"

[dev-dependencies]
puppy-testserver = { path = "../puppy-testserver" }
tempfile.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
