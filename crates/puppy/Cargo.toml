[package]
name = "puppy"
description = "A modern download manager: HTTP(S) and BitTorrent, with a background daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "puppy"
path = "src/main.rs"

[dependencies]
puppy-client = { path = "../puppy-client" }
puppy-core = { path = "../puppy-core" }
puppy-daemon = { path = "../puppy-daemon" }
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
tokio.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
puppy-proto = { path = "../puppy-proto" }
puppy-testserver = { path = "../puppy-testserver" }
fs4.workspace = true
serde_json.workspace = true
tempfile.workspace = true
