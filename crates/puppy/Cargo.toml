[package]
name = "puppy"
description = "A modern download manager: HTTP(S) and BitTorrent, with a background daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "puppy"
path = "src/main.rs"

[dependencies]
puppy-client = { path = "../puppy-client" }
puppy-core = { path = "../puppy-core" }
puppy-daemon = { path = "../puppy-daemon" }
puppy-proto = { path = "../puppy-proto" }
puppy-tui = { path = "../puppy-tui" }
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm.workspace = true
humantime.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
unicode-width.workspace = true
url.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
puppy-testserver = { path = "../puppy-testserver" }
fs4.workspace = true
# The torrent tests' local seeder (crates/puppy-torrent/tests/support).
librqbit.workspace = true
bytes.workspace = true
tempfile.workspace = true
