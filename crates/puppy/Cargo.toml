[package]
name = "puppy"
description = "A modern terminal download manager: HTTP(S) and BitTorrent, with a background daemon, a live dashboard and browser pickup"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "puppy"
path = "src/main.rs"

[dependencies]
puppy-client = { path = "../puppy-client" }
puppy-core = { path = "../puppy-core" }
puppy-daemon = { path = "../puppy-daemon" }
puppy-proto = { path = "../puppy-proto" }
puppy-tui = { path = "../puppy-tui" }
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm.workspace = true
humantime.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-width.workspace = true
url.workspace = true
clap_complete = "4.5"
clap_mangen = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
sha2 = "0.10"
puppy-testserver = { path = "../puppy-testserver" }
fs4.workspace = true
# The torrent tests' local seeder (crates/puppy-torrent/tests/support).
librqbit.workspace = true
bytes.workspace = true
tempfile.workspace = true
interprocess.workspace = true
tokio = { workspace = true, features = ["test-util"] }
