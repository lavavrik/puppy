[package]
name = "puppy-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
puppy-core = { path = "../puppy-core" }
puppy-daemon = { path = "../puppy-daemon" }
puppy-proto = { path = "../puppy-proto" }
interprocess.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
puppy-testserver = { path = "../puppy-testserver" }
tempfile.workspace = true
anyhow.workspace = true
