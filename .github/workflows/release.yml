name: Release

# Builds puppy for every supported platform and attaches the archives to a DRAFT
# GitHub release, which you review and publish by hand. Runs when a version tag
# (v0.1.0) is pushed; it can also be started from the Actions tab to build the
# archives only (they appear as run artifacts, no release is made).
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

# ci.yml (called below as `test`) must not declare a concurrency group: inside a
# called workflow `github.workflow` is the caller's name, so its group would equal
# this one and GitHub cancels the call as a deadlock.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          id=$(cargo pkgid -p puppy)
          version=${id##*#}; version=${version##*@}
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds use the oldest available runner so the binary runs on
          # glibc 2.35 and newer (Ubuntu 22.04, Debian 12, ...).
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.target }}
      - name: Build
        run: cargo build --locked --profile dist --target ${{ matrix.target }} -p puppy
      - name: Smoke test
        shell: bash
        run: target/${{ matrix.target }}/dist/puppy --version
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: puppy-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: [test, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --generate-notes \
            --title "puppy ${GITHUB_REF_NAME#v}"
