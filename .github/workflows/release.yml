name: Release

# Builds puppy for every supported platform and publishes a GitHub release with the
# archives, once the tests pass on every platform. Runs when a version tag (v0.1.0)
# is pushed; a tag with a pre-release suffix (v0.2.0-rc.1) is published as a
# pre-release, which installers and self-updates never pick up. It can also be
# started from the Actions tab to build the archives only (they appear as run
# artifacts, no release is made).
#
# Every release carries written notes: docs/releases/<tag>.md must exist in the
# tagged commit, or the run stops before building anything.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

# ci.yml (called below as `test`) must not declare a concurrency group: inside a
# called workflow `github.workflow` is the caller's name, so its group would equal
# this one and GitHub cancels the call as a deadlock.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          id=$(cargo pkgid -p puppy)
          version=${id##*#}; version=${version##*@}
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: The release notes exist
        if: github.ref_type == 'tag'
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ ! -s "$notes" ]; then
            echo "::error::missing release notes: write $notes and tag again"
            exit 1
          fi

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds use the oldest available runner so the binary runs on
          # glibc 2.35 and newer (Ubuntu 22.04, Debian 12, ...).
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.target }}
      - name: Build
        env:
          PUPPY_RELEASE_BUILD: "1"
        run: cargo build --locked --profile dist --target ${{ matrix.target }} -p puppy
      - name: Smoke test
        shell: bash
        run: target/${{ matrix.target }}/dist/puppy --version
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: puppy-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [test, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$PWD/docs/releases/$GITHUB_REF_NAME.md"
          cd dist
          cat ./*.sha256 > SHA256SUMS
          # Uploaded as a draft first and published only once every file is up,
          # so `releases/latest` (installers, self-update) never sees a partial one.
          # The written notes come first; --generate-notes appends GitHub's list
          # of merged pull requests and the full-changelog link.
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --notes-file "$notes" --generate-notes \
            --title "puppy ${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in
            *-*) kind=--prerelease ;;
            *) kind=--latest ;;
          esac
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft=false "$kind"
