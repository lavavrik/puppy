[workspace]
resolver = "3"
members = ["crates/puppy-core", "crates/puppy-proto", "crates/puppy-testserver", "crates/puppy-daemon", "crates/puppy-torrent", "crates/puppy-client", "crates/puppy-tui", "crates/puppy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
tracing = "0.1"
notify-rust = "4.18"
dirs = "6"
axum = "0.8"
tempfile = "3"
percent-encoding = "2"
http = "1"
futures-util = "0.3"
tokio-util = "0.7"
toml = "1"
interprocess = { version = "2.4", features = ["tokio"] }
anyhow = "1"
fs4 = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1"
# BitTorrent (only inside crates/puppy-torrent). rustls TLS (SHA-1 via aws-lc-rs through librqbit-sha1-wrapper's sha1-ring feature), never native-tls/OpenSSL.
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
bytes = "1"
humantime = "2.4.0"
globset = "0.4"
