[workspace]
resolver = "3"
members = ["crates/puppy-core", "crates/puppy-proto", "crates/puppy-testserver", "crates/puppy-daemon", "crates/puppy-torrent", "crates/puppy-client", "crates/puppy-tui", "crates/puppy"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lavavrik/puppy"
# Distributed as prebuilt binaries from GitHub releases, not through crates.io.
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
tracing = "0.1"
notify-rust = "4.18"
dirs = "6"
axum = "0.8"
tempfile = "3"
percent-encoding = "2"
http = "1"
futures-util = "0.3"
tokio-util = "0.7"
toml = "1"
interprocess = { version = "2.4", features = ["tokio"] }
anyhow = "1"
fs4 = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1"
# BitTorrent (only inside crates/puppy-torrent). rustls TLS (SHA-1 via aws-lc-rs through librqbit-sha1-wrapper's sha1-ring feature), never native-tls/OpenSSL.
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
bytes = "1"
humantime = "2.4.0"
globset = "0.4"
base64 = "0.22"
webpki-root-certs = "1"
rustls-native-certs = "0.8"
semver = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
# FTP(S) (puppy-core's `ftp` module). rustls with aws-lc-rs like reqwest, never native-tls/OpenSSL;
# `deprecated` enables implicit FTPS (`ftps://`).
suppaftp = { version = "13", default-features = false, features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# Metalink documents (puppy-core's `metalink` module). Never expands entities beyond XML's
# predefined ones and reports a DOCTYPE as an event, which the parser refuses.
quick-xml = "0.41"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
# SFTP (puppy-core's `sftp` module): a pure-Rust SSH client. Crypto is RustCrypto plus
# aws-lc-rs (the aws-lc-sys rustls already builds), never OpenSSL or libssh2. No `flate2`
# (compression); `rsa` for RSA host and user keys.
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs", "rsa"] }
russh-sftp = "4"

# Release binaries (GitHub releases): `cargo build --profile dist`. Kept separate so
# everyday `--release` builds stay quick.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
