[workspace]
resolver = "3"
members = ["crates/puppy-core", "crates/puppy-proto", "crates/puppy-testserver", "crates/puppy-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
tracing = "0.1"
dirs = "6"
axum = "0.8"
tempfile = "3"
percent-encoding = "2"
http = "1"
futures-util = "0.3"
tokio-util = "0.7"
toml = "1"
interprocess = { version = "2.4", features = ["tokio"] }
